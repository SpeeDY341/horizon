[package]
name = "horizon-streamline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Isolated native NVIDIA Streamline integration for Vulkan and DirectX 12"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8.9"
ash = { version = "0.38", default-features = false, features = ["loaded"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "dx12", "wgsl"] }

pollster = "0.4"
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
